<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152b35">
<meta name="description" content="光影大亨：香港像素戲院經營。排片、定價、親自救場，逐格擴建，買斷物業並經營分店。">
<title>光影大亨 · 戲院經營</title><link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="game.css?v=0.7.0"><link rel="stylesheet" href="studio.css?v=0.7.0"><link rel="stylesheet" href="mobile.css?v=0.7.0">
</head>
<body>
<div class="app-shell mobile-game">
<header class="topbar">
<span class="mobile-brand" aria-label="光影大亨">L</span>
<button id="branch-picker" class="branch-picker" aria-label="選擇戲院"><span id="active-branch-name">旺角 · 光影戲院</span>⌄</button>
<div class="company-cash"><strong id="cash">$68,000</strong></div>
<div class="mobile-time"><span id="day-number">第1日</span><b id="game-clock">11:00</b></div>
<button id="cycle-speed" aria-label="切換營業速度">1×</button>
<button id="pause-button" class="primary" hidden>暫停</button><button id="main-action" class="primary">建造戲院</button>
<button id="more-button" aria-label="更多選項" aria-expanded="false">⋯</button>
</header>
<main id="main-content"><div id="work-header"></div><div id="view-content"></div></main>
<nav class="bottom-nav" aria-label="戲院工作頁">
<button data-view="overview" data-group="map" aria-pressed="true">地圖</button><button data-view="schedule" data-group="programme">排片</button><button data-view="staff" data-group="operations">營運</button><button data-view="strategy" data-group="business">經營</button><button data-view="investment" data-group="investment">投資</button>
</nav>
<section id="utilities" class="utility-menu" aria-label="更多選項" hidden>
<button id="save-button">儲存進度</button><button id="load-button">讀取進度</button><button id="sound-button" aria-label="切換音效" aria-pressed="false">音效</button><button id="help-button">操作說明</button><button id="fullscreen-button">全螢幕</button>
<div class="speeds" aria-label="營業速度"><button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button></div>
<small class="release-mark">LUMEN CINEMA · 0.7.0</small>
</section>
</div>
<!-- Existing metadata/update contracts; only actionable information stays on the game HUD. -->
<div hidden><span id="calendar"></span><span id="phase-label"></span><span id="property-badge"></span><span id="time-note"></span><span id="day-progress"></span><span id="branch-count"></span><div id="branch-buttons"></div><button id="second-branch">開設第二間戲院</button><span id="page-eyebrow"></span><span id="page-title"></span><span id="page-description"></span></div>
<div id="toast" role="status" aria-live="polite" hidden></div><dialog id="modal"><div id="modal-content"></div></dialog>
<script src="game.mjs?v=0.7.0" type="module"></script>
</body></html>

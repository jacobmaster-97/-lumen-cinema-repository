name: Publish playable game to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/browser/package-lock.json
      - name: Install test dependencies
        run: npm ci --prefix prototypes/browser --ignore-scripts --no-audit --no-fund
      - name: Test playable prototype
        run: npm test --prefix prototypes/browser
      - name: Build self-contained Pages site
        run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
